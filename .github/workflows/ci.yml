name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Declare minimal permissions explicitly for supply-chain auditability.
# A pure CI job needs only read access to the repository contents.
permissions:
  contents: read

# Cancel any in-progress run for the same workflow + ref (e.g. rapid pushes to
# a branch or a force-push during rebase). Mirrors the pattern in ai-council-review.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: '0.6.0'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run lint
        run: ruff check .

      - name: Run format check
        run: ruff format --check .

      - name: Run type check
        run: mypy src/ai_council_review

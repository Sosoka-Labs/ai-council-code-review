name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly scan independent of commit activity (Monday 14:30 UTC)
    - cron: '30 14 * * 1'

# Least-privilege: CodeQL needs read access to code and write access to upload
# SARIF results to the GitHub Security tab. No other scopes are required.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning requires GitHub Code Security, which is free on public
    # repositories but unavailable on private ones. Skip while private so the
    # check stays green; it activates automatically once the repo goes public.
    if: github.event.repository.visibility == 'public'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1a818fd5f97ed0ee9a823421bd5b171add01227f  # v4.36.2
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1a818fd5f97ed0ee9a823421bd5b171add01227f  # v4.36.2
        with:
          category: "/language:python"

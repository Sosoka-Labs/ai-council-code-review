# AI Council Code Review — Example Configuration
#
# Copy this file to .ai-council/config.yaml in your repository root
# to customize agents, models, and review behavior.
#
# If this file is missing, AI Council uses sensible defaults.

version: "1"

# ── Review Settings ─────────────────────────────────────────────────────────
review_depth: standard          # "standard" | "deep"
max_files: 50                   # Skip PRs with more than this many files
max_lines: 2000                 # Skip PRs with more than this many changed lines
max_diff_size: 50000            # Skip PRs with diff larger than this (bytes)
comment_on_forks: false         # Skip commenting on fork PRs by default
skip_drafts: true               # Skip draft PRs
skip_labels:                    # Skip PRs with any of these labels
  - "skip-ai-review"
  - "wip"
skip_patterns:                  # Skip files matching these patterns
  - "package-lock.json"           # Exact filename match
  - "yarn.lock"
  - "poetry.lock"
  - "Cargo.lock"
  - "Gemfile.lock"
  - "*.snap"                      # Glob wildcard: all .snap files
  - "dist/"                       # Directory prefix: anything under dist/
  - "build/"
  - "node_modules/"
  - "**/*.pyc"                    # Glob: all .pyc files in any directory

# ── Cost & Timeout Control ──────────────────────────────────────────────────
budget_usd: 5.00                # Max estimated cost per PR
agent_timeout_seconds: 300      # Per-agent timeout (5 minutes)
total_timeout_seconds: 600      # Overall workflow timeout (10 minutes)
debug: false                    # Dump debug artifact when true
rate_limit_threshold: 50        # Enter conservative mode below this threshold

# ── Agent Configuration ─────────────────────────────────────────────────────
# Each agent can be enabled/disabled, assigned a model and provider,
# and given a custom system prompt.
#
# `model` is the provider name: fireworks, openai, or anthropic
# `model_name` can be a full model identifier or a shorthand alias:
#   fireworks/llama-3.1-70b, fireworks/llama-3.1-8b, fireworks/kimi-k2p6
#   openai/gpt-4o, openai/gpt-4.1, openai/gpt-4.1-mini
#   anthropic/claude-sonnet, anthropic/claude-haiku
# `temperature` controls creativity vs determinism
# `max_tokens` caps the response length

agents:
  # Router decides which specialist agents to invoke based on the PR diff.
  # Use a fast, cheap model here — it only classifies.
  router:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-8b   # fast, cheap
    temperature: 0.1
    max_tokens: 2000

  # Security checks for vulnerabilities, secrets, auth issues, and injection risks.
  security:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.2
    max_tokens: 16000
    skills: [oauth-pitfalls]             # bind the bundled demo skill to this agent

  # Quality checks for bugs, logic errors, type safety, missing tests, and readability.
  quality:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.3
    max_tokens: 16000

  # Architecture checks cross-file impact, documentation freshness, API consistency,
  # and dependency alignment.
  architecture:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.3
    max_tokens: 16000

  # Performance detects N+1 queries, unbounded result sets, O(n²) patterns,
  # sync I/O on hot paths, and missing caching/indexes.
  # Triggered when ORM, DB queries, loops over collections, or data-pipeline
  # code appears in the diff.
  performance:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.3
    max_tokens: 16000
    skills: [n-plus-one]                 # bind N+1 detection guidance

  # Documentation checks for stale docstrings vs changed signatures, missing
  # docstrings on new public APIs, changelog gaps, and broken examples.
  # Triggered when *.md, public function/class signatures, or new exports change.
  documentation:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.3
    max_tokens: 16000
    skills: [docstring-style]            # bind docstring style guidance

  # DevOps reviews GitHub Actions workflows, Dockerfiles, Terraform, shell
  # scripts, and CI/CD configuration for security and correctness issues.
  # Triggered when .github/workflows/*, Dockerfile, *.tf, *.sh files change.
  devops:
    enabled: true
    model: fireworks
    model_name: fireworks/llama-3.1-70b
    temperature: 0.3
    max_tokens: 16000
    skills: [github-actions-hardening]   # bind Actions hardening guidance

  # Synthesis merges all agent outputs, deduplicates, prioritizes, and formats
  # the final review. Use a strong reasoning model here.
  synthesis:
    enabled: true
    model: fireworks
    model_name: fireworks/kimi-k2p6      # strong reasoning
    temperature: 0.2
    max_tokens: 16000

# ── Skills ──────────────────────────────────────────────────────────────────
# Skills are domain knowledge files at .ai-council/skills/<name>/SKILL.md
# that you can bind to specific agents. Three patterns:
#
#   1. Explicit per-agent binding (recommended for most projects):
#      agents:
#        security:
#          skills: [oauth-pitfalls, jwt-validation]
#
#   2. Star sentinel — give one agent every discovered skill:
#      agents:
#        architecture:
#          skills: "*"
#
#   3. Top-level default — apply to every agent that doesn't set its own:
#      default_agent_skills: [domain-glossary]
#
# Resolution per agent: explicit skills: → default_agent_skills → none
# Set skills: [] on an agent to explicitly opt out from the default.
#
# skills_path: .ai-council/skills      # where SKILL.md files live; default shown
# default_agent_skills: null            # optional list, "*" sentinel, or null
# skills_token_budget_soft: 8000        # warn if an agent's total skill bodies exceed
# skills_token_budget_hard: 16000       # error if an agent's total skill bodies exceed
#
# Bundled skills in this example:
#   oauth-pitfalls          → security agent: OAuth 2.0 / JWT review guidance
#   n-plus-one              → performance agent: N+1 query and ORM patterns
#   docstring-style         → documentation agent: Google-style docstring conventions
#   github-actions-hardening → devops agent: Actions security and correctness

# ── LLM Provider Settings ───────────────────────────────────────────────────
# API keys are loaded from environment variables (FIREWORKS_API_KEY, etc.)
# but you can hardcode them here if needed (not recommended for public repos).

providers:
  fireworks:
    api_key: null
  openai:
    api_key: null
  anthropic:
    api_key: null

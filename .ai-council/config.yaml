# AI Council — self-dogfood configuration
# NOTE: This intentionally differs from the public default (OpenAI/gpt-4.1-mini).
# Routes every agent to Fireworks.ai so the council can review its own pull
# requests with the FIREWORKS_API_KEY repository secret. All agents use kimi-k2p6,
# the model this account's key is entitled to.
# (review_depth: deep runs all six specialists; drop to "standard" to cap at four.)

version: "1"

review_depth: deep              # uncapped — let every relevant specialist run on our own PRs
max_files: 60
max_lines: 3000
max_diff_size: 150000
comment_on_forks: false
skip_drafts: true
skip_labels:
  - "skip-ai-review"
  - "wip"
skip_patterns:
  - "package-lock.json"
  - "yarn.lock"
  - "poetry.lock"
  - "uv.lock"
  - "*.snap"
  - "dist/"
  - "build/"
  - "node_modules/"
  - "**/*.pyc"

budget_usd: 5.00
agent_timeout_seconds: 300
total_timeout_seconds: 600
debug: true

agents:
  # Classification and merge nodes.
  router:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.1
    max_tokens: 2000

  synthesis:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.2
    max_tokens: 16000

  # Specialists — each with its bound domain skill.
  security:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.2
    max_tokens: 16000
    skills: [oauth-pitfalls]

  quality:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.3
    max_tokens: 16000

  architecture:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.3
    max_tokens: 16000

  performance:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.3
    max_tokens: 16000
    skills: [n-plus-one]

  documentation:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.3
    max_tokens: 16000
    skills: [docstring-style]

  devops:
    enabled: true
    model: fireworks
    model_name: accounts/fireworks/models/kimi-k2p6
    temperature: 0.3
    max_tokens: 16000
    skills: [github-actions-hardening]
